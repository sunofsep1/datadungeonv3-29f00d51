<!--
  ============================================================================
  GREG'S NEWSLETTER SIGNUP — embed snippet for gregleighproperty.com.au
  ============================================================================
  Paste this whole block anywhere in a page (footer, sidebar, or its own
  section). Fully self-contained: inline styles + inline script, no external
  files needed. It posts to the redlandshomevalue.com.au Netlify proxy, which
  already allows gregleighproperty.com.au via CORS.

  NOTE: works only from https://gregleighproperty.com.au or
  https://www.gregleighproperty.com.au (the proxy's CORS allow-list).
  ============================================================================
-->
<div style="background:#172849;padding:48px 24px;text-align:center;font-family:'Source Sans 3',-apple-system,'Segoe UI',sans-serif;">
  <p style="margin:0 0 12px;font-size:13px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#B99A50;">The inside track</p>
  <h2 style="margin:0 0 12px;font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:32px;color:#ffffff;line-height:1.15;">Join my exclusive Redlands list</h2>
  <p style="margin:0 auto 24px;max-width:520px;font-size:16px;line-height:1.55;color:#D8D0BE;">Off-market listings before they hit the portals, straight-talking market updates, and what you need to know to buy or sell in a changing market.</p>
  <form id="glp-nl-form" novalidate style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:0 auto;">
    <input type="text" name="nl_first_name" placeholder="First name" autocomplete="given-name"
      style="flex:1 1 160px;max-width:220px;height:50px;padding:0 16px;border:1px solid rgba(255,255,255,.25);border-radius:2px;background:rgba(255,255,255,.06);color:#fff;font-size:16px;" />
    <input type="email" name="nl_email" placeholder="Email address" autocomplete="email" inputmode="email" required
      style="flex:1 1 220px;max-width:280px;height:50px;padding:0 16px;border:1px solid rgba(255,255,255,.25);border-radius:2px;background:rgba(255,255,255,.06);color:#fff;font-size:16px;" />
    <input type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;" />
    <button type="submit"
      style="height:50px;padding:0 28px;border:none;border-radius:2px;background:#B99A50;color:#172849;font-weight:700;font-size:16px;cursor:pointer;">Join the list</button>
    <p id="glp-nl-msg" role="alert" hidden style="flex-basis:100%;margin:6px 0 0;font-size:14px;color:#F4C7C3;"></p>
  </form>
  <p style="margin:16px 0 0;font-size:13px;color:#8E97AC;">No spam. Unsubscribe any time with one click.</p>
</div>
<script>
(function () {
  var form = document.getElementById("glp-nl-form");
  if (!form) return;
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var email = (form.nl_email.value || "").trim();
    var msg = document.getElementById("glp-nl-msg");
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      if (msg) { msg.textContent = "Please enter a valid email address."; msg.hidden = false; }
      return;
    }
    if (msg) msg.hidden = true;
    var btn = form.querySelector("button[type=submit]");
    if (btn) { btn.disabled = true; btn.textContent = "Joining…"; }
    fetch("https://redlandshomevalue.com.au/.netlify/functions/newsletter-subscribe", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: email,
        first_name: (form.nl_first_name.value || "").trim(),
        company: form.company ? form.company.value : ""
      })
    })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); })
      .then(function () {
        var done = document.createElement("p");
        done.style.cssText = "margin:8px 0 0;font-size:17px;font-weight:600;color:#B99A50;";
        done.innerHTML = "✓&nbsp; You’re in — check your inbox for a welcome note from Greg.";
        form.replaceWith(done);
      })
      .catch(function () {
        if (btn) { btn.disabled = false; btn.textContent = "Join the list"; }
        if (msg) { msg.textContent = "Sorry — that didn’t go through. Please try again in a moment."; msg.hidden = false; }
      });
  });
})();
</script>
