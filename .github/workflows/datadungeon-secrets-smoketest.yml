name: DataDungeon Secrets Smoke Test

# Verifies that the DATADUNGEON_* repo secrets are configured and that
# the Supabase service_role key can reach the project. Does NOT print
# secret values to logs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/datadungeon-secrets-smoketest.yml'

jobs:
  smoketest:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are present (no values printed)
        env:
          DATADUNGEON_SUPABASE_URL: ${{ secrets.DATADUNGEON_SUPABASE_URL }}
          DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY }}
          DATADUNGEON_ALLOWED_USER_IDS: ${{ secrets.DATADUNGEON_ALLOWED_USER_IDS }}
        run: |
          missing=0
          [ -z "$DATADUNGEON_SUPABASE_URL" ] && echo "::error::DATADUNGEON_SUPABASE_URL not set" && missing=1
          [ -z "$DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY" ] && echo "::error::DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY not set" && missing=1
          [ -z "$DATADUNGEON_ALLOWED_USER_IDS" ] && echo "::error::DATADUNGEON_ALLOWED_USER_IDS not set" && missing=1
          if [ "$missing" = "1" ]; then exit 1; fi
          echo "All three DATADUNGEON_* secrets are present."
          # Report counts only (never the values themselves)
          url_len=${#DATADUNGEON_SUPABASE_URL}
          key_len=${#DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY}
          uid_count=$(echo "$DATADUNGEON_ALLOWED_USER_IDS" | tr ',' '\n' | grep -c .)
          echo "URL length: $url_len chars"
          echo "Service role key length: $key_len chars"
          echo "Allowed user ID count: $uid_count"

      - name: Verify Supabase reachability (service_role auth)
        env:
          DATADUNGEON_SUPABASE_URL: ${{ secrets.DATADUNGEON_SUPABASE_URL }}
          DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Hit the PostgREST root with the service_role key.
          # A configured project returns 200 and a small OpenAPI swagger doc.
          # We only print the HTTP status, never the body or headers.
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $DATADUNGEON_SUPABASE_SERVICE_ROLE_KEY" \
            "$DATADUNGEON_SUPABASE_URL/rest/v1/")
          echo "Supabase REST status: $status"
          case "$status" in
            200|404) echo "Supabase reachable and accepted the service_role key."; exit 0 ;;
            401|403) echo "::error::Supabase rejected the service_role key (HTTP $status). Rotate/update it."; exit 1 ;;
            000)     echo "::error::Could not reach Supabase URL. Check DATADUNGEON_SUPABASE_URL."; exit 1 ;;
            *)       echo "::error::Unexpected status $status from Supabase."; exit 1 ;;
          esac

      - name: Validate allowed user ID format
        env:
          DATADUNGEON_ALLOWED_USER_IDS: ${{ secrets.DATADUNGEON_ALLOWED_USER_IDS }}
        run: |
          # UUID v4-ish regex; permissive on version digit.
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          bad=0
          i=0
          IFS=',' read -ra ids <<< "$DATADUNGEON_ALLOWED_USER_IDS"
          for id in "${ids[@]}"; do
            i=$((i+1))
            if [[ ! "$id" =~ $uuid_re ]]; then
              echo "::error::Entry #$i in DATADUNGEON_ALLOWED_USER_IDS is not a valid UUID"
              bad=1
            fi
          done
          if [ "$bad" = "1" ]; then exit 1; fi
          echo "All $i allowed user ID(s) are valid UUIDs."
